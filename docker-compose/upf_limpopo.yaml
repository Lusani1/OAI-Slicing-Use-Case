version: '3.8'

services:
    vpp-upf:
        privileged: true
        container_name: "vpp-upf"
        image: oaisoftwarealliance/oai-upf-vpp:v2.1.0

        environment:
            - IF_1_IP=192.168.80.201
            - IF_1_TYPE=N4
            - IF_2_IP=192.168.82.201
            - IF_2_TYPE=N3
            - IF_2_NWI=access.oai.org
            - IF_3_IP=192.168.83.201
            - IF_3_TYPE=N6
            - IF_3_IP_REMOTE=192.168.83.1 # EXT-DN IP Address
            - IF_3_NWI=internet.oai.org
            - NAME=VPP-UPF
            - MNC=95
            - MCC=208
            - REALM=3gppnetwork.org
            - VPP_MAIN_CORE=0
            - VPP_CORE_WORKER=1
#           - VPP_PLUGIN_PATH=/usr/lib64/vpp_plugins/                # RHEL7
            - VPP_PLUGIN_PATH=/usr/lib/x86_64-linux-gnu/vpp_plugins/ # Ubuntu18.04
            - SNSSAI_SD=00007B
            - SNSSAI_SST=222
            - DNN=default
            - REGISTER_NRF=yes
            - NRF_IP_ADDR=192.168.90.130
            - NRF_PORT=8080
            - HTTP_VERSION=2

        healthcheck:
            test: /bin/bash -c "pgrep vpp"
            interval: 10s
            timeout: 5s
            retries: 5

        post_start:
            - command: >
                  /bin/bash -lc '
                  echo "[post_start] Waiting for UPF interface n4-1...";

                  for i in {1..30}; do
                      if ip link show n4-1 >/dev/null 2>&1; then
                          echo "[post_start] n4-1 found. Adding default route via 192.168.80.1";
                          ip route replace default via 192.168.80.1 dev n4-1;
                          echo "[post_start] Current routes:";
                          ip route;
                          exit 0;
                      fi;

                      echo "[post_start] n4-1 not ready yet. Retry $i/30";
                      sleep 2;
                  done;

                  echo "[post_start] WARNING: n4-1 not found after waiting.";
                  echo "[post_start] Trying to add default route without explicit interface.";
                  ip route replace default via 192.168.80.1;
                  echo "[post_start] Current routes:";
                  ip route;
                  '
              user: root
              privileged: true

        networks:
            public_net:
                ipv4_address: 192.168.80.134
            public_net_access:
                ipv4_address: 192.168.82.134
            public_net_core:
                ipv4_address: 192.168.83.134

networks:
    public_net:
        driver: bridge
        name: demo-oai-public-net
        ipam:
            config:
                - subnet: 192.168.80.0/24
        driver_opts:
            com.docker.network.bridge.name: "demo-oai"

    public_net_access:
        name: oai-public-access
        ipam:
            config:
                - subnet: 192.168.82.0/24
        driver_opts:
            com.docker.network.bridge.name: "cn5g-access"

    public_net_core:
        name: oai-public-core
        ipam:
            config:
                - subnet: 192.168.83.0/24
        driver_opts:
            com.docker.network.bridge.name: "cn5g-core"
